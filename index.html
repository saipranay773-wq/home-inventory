<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Inventory</title>
<style>
  :root{
    --ink:#1c1b1a;
    --paper:#faf8f5;
    --line:#e4e0d8;
    --accent:#8a5a3b;
    --accent-soft:#f1e4d8;
    --muted:#7a746b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .header{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--paper);
    padding:14px 16px 12px 16px;
    border-bottom:1px solid var(--line);
  }
  .title{
    font-size:15px;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px 0;
  }
  .search-wrap{
    position:relative;
  }
  #search{
    width:100%;
    padding:13px 40px 13px 14px;
    font-size:17px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    outline:none;
    -webkit-appearance:none;
  }
  #search:focus{
    border-color:var(--accent);
  }
  .clear-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    border:none;
    background:var(--line);
    color:var(--ink);
    border-radius:50%;
    font-size:16px;
    line-height:1;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .clear-btn.show{display:flex;}
  .count{
    padding:10px 16px 4px 16px;
    font-size:13px;
    color:var(--muted);
  }
  .list{
    padding:4px 12px 40px 12px;
  }
  .row{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .item-name{
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:4px;
  }
  .item-location{
    font-size:14px;
    color:var(--accent);
    background:var(--accent-soft);
    display:inline-block;
    padding:3px 9px;
    border-radius:6px;
  }
  mark{
    background:#ffe9a8;
    color:inherit;
    border-radius:3px;
    padding:0 1px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:15px;
  }
</style>
</head>
<body>

<div class="header">
  <p class="title">Home Inventory</p>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search for an item…" autocomplete="off" autofocus>
    <button class="clear-btn" id="clearBtn" aria-label="Clear">✕</button>
  </div>
</div>

<div class="count" id="count"></div>
<div class="list" id="list"></div>

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + "<mark>" + escapeHtml(text.slice(idx, idx+q.length)) + "</mark>" + escapeHtml(text.slice(idx+q.length));
}

function render(){
  const q = searchInput.value.trim();
  clearBtn.classList.toggle('show', q.length > 0);

  let results = items;
  if(q){
    const qLower = q.toLowerCase();
    results = items.filter(([name, loc]) =>
      name.toLowerCase().includes(qLower) || loc.toLowerCase().includes(qLower)
    );
  }

  countEl.textContent = q ? `${results.length} match${results.length===1?'':'es'}` : `${items.length} items total`;

  if(results.length === 0){
    listEl.innerHTML = `<div class="empty">No items match "${escapeHtml(q)}"</div>`;
    return;
  }

  listEl.innerHTML = results.map(([name, loc]) => `
    <div class="row">
      <div class="item-name">${highlight(name, q)}</div>
      <div class="item-location">${highlight(loc, q)}</div>
    </div>
  `).join('');
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  render();
  searchInput.focus();
});

render();
